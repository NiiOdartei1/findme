{% extends 'admin/base.html' %}

{% block title %}Add Category | FindMe Admin{% endblock %}
{% block page_title %}Add category{% endblock %}

{% block content %}
<div class="admin-panel" style="max-width: 520px; margin: 0 auto;">
  <form method="POST">
    <div class="form-group">
      <label>Category name *</label>
      <input type="text" name="name" placeholder="e.g., Essentials" required />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4" placeholder="What's in this category?"></textarea>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin_categories') }}" class="admin-button admin-button-secondary">Cancel</a>
      <button type="submit" class="admin-button admin-button-primary">Create category</button>
    </div>
  </form>
</div>
{% endblock %}
