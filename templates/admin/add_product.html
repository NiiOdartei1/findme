{% extends 'admin/base.html' %}

{% block title %}Add Product | FindMe Admin{% endblock %}
{% block page_title %}Add product{% endblock %}

{% block content %}
<div class="admin-panel form-card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="form-group">
      <label for="product-name">Product name *</label>
      <input id="product-name" type="text" name="name" placeholder="e.g., Signature Hoodie" maxlength="255" required />
    </div>

    <div class="form-group">
      <label for="product-description">Description</label>
      <textarea id="product-description" name="description" rows="4" placeholder="Product description..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-category">Category *</label>
        <select id="product-category" name="category_id" required>
          <option value="">Select category</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="product-price">Price *</label>
        <input id="product-price" type="number" name="price" min="0" step="0.01" placeholder="129.99" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-old-price">Original price</label>
        <input id="product-old-price" type="number" name="old_price" min="0" step="0.01" placeholder="169.99" />
      </div>

      <div class="form-group">
        <label for="product-stock">Stock</label>
        <input id="product-stock" type="number" name="stock" min="0" value="0" />
      </div>
    </div>

    <div class="form-group">
      <label for="product-image">Image URL</label>
      <input id="product-image" type="url" name="image" placeholder="https://..." />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-colors">Colors</label>
        <input id="product-colors" type="text" name="colors" placeholder="Sand, Black, Stone" />
      </div>

      <div class="form-group">
        <label for="product-sizes">Sizes</label>
        <input id="product-sizes" type="text" name="sizes" placeholder="S, M, L, XL" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-rating">Rating (0-5)</label>
        <input id="product-rating" type="number" name="rating" min="0" max="5" step="0.1" value="5.0" />
      </div>

      <div class="form-group checkbox-row">
        <label class="checkbox-label"><input type="checkbox" name="featured" /> Featured product</label>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin_products') }}" class="admin-button admin-button-secondary">Cancel</a>
      <button type="submit" class="admin-button admin-button-primary">Create product</button>
    </div>
  </form>
</div>
{% endblock %}
