{% extends 'admin/base.html' %}

{% block title %}Add Product | FindMe Admin{% endblock %}
{% block page_title %}Add product{% endblock %}

{% block content %}
<div class="admin-panel" style="max-width: 760px; margin: 0 auto;">
  <form method="POST">
    <div class="form-group">
      <label>Product name *</label>
      <input type="text" name="name" placeholder="e.g., Signature Hoodie" required />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4" placeholder="Product description..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" required>
          <option value="">Select category</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Price *</label>
        <input type="number" name="price" step="0.01" placeholder="129.99" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Original price</label>
        <input type="number" name="old_price" step="0.01" placeholder="169.99" />
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" name="stock" value="0" />
      </div>
    </div>

    <div class="form-group">
      <label>Image URL</label>
      <input type="url" name="image" placeholder="https://..." />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Colors</label>
        <input type="text" name="colors" placeholder="Sand, Black, Stone" />
      </div>

      <div class="form-group">
        <label>Sizes</label>
        <input type="text" name="sizes" placeholder="S, M, L, XL" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Rating (0-5)</label>
        <input type="number" name="rating" min="0" max="5" step="0.1" value="5.0" />
      </div>

      <div class="form-group checkbox-row">
        <label class="checkbox-label"><input type="checkbox" name="featured" /> Featured product</label>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin_products') }}" class="admin-button admin-button-secondary">Cancel</a>
      <button type="submit" class="admin-button admin-button-primary">Create product</button>
    </div>
  </form>
</div>
{% endblock %}
