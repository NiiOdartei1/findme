{% extends 'admin/base.html' %}

{% block title %}Edit Product | FindMe Admin{% endblock %}
{% block page_title %}Edit product{% endblock %}

{% block content %}
<div class="admin-page-intro">
  <div>
    <h2>Update product details</h2>
    <p>Changes will be reflected in your storefront.</p>
  </div>
</div>
<div class="admin-panel form-card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="form-group">
      <label for="product-name">Product name *</label>
      <input id="product-name" type="text" name="name" value="{{ product.name }}" maxlength="255" required />
    </div>

    <div class="form-group">
      <label for="product-description">Description</label>
      <textarea id="product-description" name="description" rows="4">{{ product.description }}</textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-category">Category *</label>
        <select id="product-category" name="category_id" required>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id == product.category_id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="product-price">Price *</label>
        <input id="product-price" type="number" name="price" min="0" step="0.01" value="{{ product.price }}" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-old-price">Original price</label>
        <input id="product-old-price" type="number" name="old_price" min="0" step="0.01" value="{{ product.old_price or '' }}" />
      </div>

      <div class="form-group">
        <label for="product-stock">Stock</label>
        <input id="product-stock" type="number" name="stock" min="0" value="{{ product.stock }}" />
      </div>
    </div>

    <div class="form-group">
      <label for="product-image">Image URL</label>
      <input id="product-image" type="url" name="image" value="{{ product.image }}" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-colors">Colors</label>
        <input id="product-colors" type="text" name="colors" value="{{ product.colors|join(', ') if product.colors else '' }}" />
      </div>

      <div class="form-group">
        <label for="product-sizes">Sizes</label>
        <input id="product-sizes" type="text" name="sizes" value="{{ product.sizes|join(', ') if product.sizes else '' }}" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="product-rating">Rating (0-5)</label>
        <input id="product-rating" type="number" name="rating" min="0" max="5" step="0.1" value="{{ product.rating }}" />
      </div>

      <div class="form-group checkbox-row">
        <label class="checkbox-label"><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %} /> Featured product</label>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin_products') }}" class="admin-button admin-button-secondary">Cancel</a>
      <button type="submit" class="admin-button admin-button-primary">Save changes</button>
    </div>
  </form>
</div>
{% endblock %}
