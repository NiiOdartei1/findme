{% extends 'admin/base.html' %}

{% block title %}Edit Product | FindMe Admin{% endblock %}
{% block page_title %}Edit product{% endblock %}

{% block content %}
<div class="admin-panel" style="max-width: 760px; margin: 0 auto;">
  <form method="POST">
    <div class="form-group">
      <label>Product name *</label>
      <input type="text" name="name" value="{{ product.name }}" required />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4">{{ product.description }}</textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" required>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id == product.category_id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Price *</label>
        <input type="number" name="price" step="0.01" value="{{ product.price }}" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Original price</label>
        <input type="number" name="old_price" step="0.01" value="{{ product.old_price or '' }}" />
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" name="stock" value="{{ product.stock }}" />
      </div>
    </div>

    <div class="form-group">
      <label>Image URL</label>
      <input type="url" name="image" value="{{ product.image }}" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Colors</label>
        <input type="text" name="colors" value="{{ product.colors|join(', ') if product.colors else '' }}" />
      </div>

      <div class="form-group">
        <label>Sizes</label>
        <input type="text" name="sizes" value="{{ product.sizes|join(', ') if product.sizes else '' }}" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Rating (0-5)</label>
        <input type="number" name="rating" min="0" max="5" step="0.1" value="{{ product.rating }}" />
      </div>

      <div class="form-group checkbox-row">
        <label class="checkbox-label"><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %} /> Featured product</label>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('admin_products') }}" class="admin-button admin-button-secondary">Cancel</a>
      <button type="submit" class="admin-button admin-button-primary">Save changes</button>
    </div>
  </form>
</div>
{% endblock %}
