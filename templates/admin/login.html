{% extends 'admin/base.html' %}

{% block title %}Admin Login | FindMe{% endblock %}

{% block content %}
<div class="admin-login-shell">
  <div class="admin-login-card">
    <p class="admin-login-kicker">Secure access</p>
    <h1>Admin login</h1>

    <form method="POST" class="admin-auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input id="admin-email" type="email" name="email" placeholder="admin@findme.shop" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input id="admin-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="admin-button admin-button-primary full-width">Login</button>
    </form>
  </div>
</div>
{% endblock %}
